[project]
name = "pinn-qushion"
version = "0.1.0"
description = "PINN solver for 1D Schrödinger equation with web visualization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Robert Jones", email = "jonesrobm@gmail.com"}]
dependencies = [
    "jax>=0.9.1",
    "equinox>=0.13.6",
    "optax>=0.2.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
    "huggingface_hub>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/Jones-Robert-M/pinn-qushion"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
